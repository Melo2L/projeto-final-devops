name: SurfPulse CI/CD (DEV -> STG -> PRD)

on:
  workflow_dispatch:
  pull_request:
    branches: ["main","principal"]
  push:
    branches: ["main","principal"]

jobs:
  quality-gate:
    name: Quality Gate (Tests + Security)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (PROD set)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Dependency vulnerability scan (pip-audit) - PROD
        run: |
          pip install pip-audit
          pip-audit -r requirements-prod.txt -f json -o pip-audit-report.json
      - name: Run tests
        run: |
          set -e
          if [ -d services ]; then pytest -q || echo "No tests executed"; else echo "No services folder"; fi

      - name: SAST Scan (Bandit)
        run: |
          pip install bandit
          bandit -r services -ll -f txt -o bandit-result.txt

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-result.txt
            pip-audit-report.json

  build-and-scan-images:
    name: Build Images + Trivy
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name != 'pull_request'
    env:
      COMPOSE_PROJECT_NAME: surfpulse

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: |
          set -e
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Create .env for CI build
        run: |
          echo "APP_TAG=${{ github.sha }}" > .env
          echo "REGISTRY=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> .env
          echo "ENVIRONMENT=CI" >> .env
          echo "INTERNAL_TOKEN=${{ secrets.INTERNAL_TOKEN }}" >> .env

      - name: Clean Docker cache
        run: docker builder prune -af || true

      - name: Build images (PROD only)
        run: |
          set -e
          docker compose -f docker-compose.yml build --no-cache

      - name: Trivy scan - gateway
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: local/gateway:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          pkg-types: os,library

      - name: Trivy scan - surf-data
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: local/surf-data-service:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          pkg-types: os,library

      - name: Trivy scan - notification
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: local/notification-service:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          pkg-types: os,library

      - name: Trivy scan - scheduler
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: local/scheduler-service:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          pkg-types: os,library

      - name: Tag images for Docker Hub
        run: |
          set -e
          docker tag local/gateway:test ${{ secrets.DOCKER_USERNAME }}/surfpulse-gateway:${{ github.sha }}
          docker tag local/surf-data-service:test ${{ secrets.DOCKER_USERNAME }}/surfpulse-surf-data-service:${{ github.sha }}
          docker tag local/notification-service:test ${{ secrets.DOCKER_USERNAME }}/surfpulse-notification-service:${{ github.sha }}
          docker tag local/scheduler-service:test ${{ secrets.DOCKER_USERNAME }}/surfpulse-scheduler-service:${{ github.sha }}

      - name: Push images to Docker Hub
        run: |
          set -e
          docker push ${{ secrets.DOCKER_USERNAME }}/surfpulse-gateway:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/surfpulse-surf-data-service:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/surfpulse-notification-service:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/surfpulse-scheduler-service:${{ github.sha }}


  deploy-dev:
    name: Deploy DEV (auto)
    runs-on: ubuntu-latest
    needs: build-and-scan-images
    if: github.event_name != 'pull_request'
    env:
      COMPOSE_PROJECT_NAME: surfpulse

    steps:
      - uses: actions/checkout@v4

      - name: Deploy DEV
        run: |
          set -e
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

          echo "APP_TAG=${{ github.sha }}" > .env
          echo "REGISTRY=${{ secrets.DOCKER_USERNAME }}" >> .env
          echo "COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}" >> .env
          echo "ENVIRONMENT=DEV" >> .env
          echo "INTERNAL_TOKEN=${{ secrets.INTERNAL_TOKEN }}" >> .env

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.ci.yml \
            build

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            -f docker-compose.ci.yml \
            up -d



      - run: |
          set -e
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v


  deploy-stg:
    name: Deploy STG (auto)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name != 'pull_request'
    env:
      COMPOSE_PROJECT_NAME: surfpulse

    steps:
      - uses: actions/checkout@v4

      - run: |
          set -e
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

          echo "APP_TAG=${GITHUB_SHA}" > .env
          echo "REGISTRY=${{ secrets.DOCKER_USERNAME }}" >> .env

          docker compose -f docker-compose.yml -f docker-compose.stg.yml up -d --no-build

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.stg.yml down -v


  deploy-prd:
    name: Deploy PRD (auto)
    runs-on: ubuntu-latest
    needs: deploy-stg
    if: github.event_name != 'pull_request'
    env:
      COMPOSE_PROJECT_NAME: surfpulse

    steps:
      - uses: actions/checkout@v4

      - run: |
          set -e
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" \
          --password-stdin

          echo "APP_TAG=${GITHUB_SHA}" > .env
          echo "REGISTRY=${{ secrets.DOCKER_USERNAME }}" >> .env

          docker compose -f docker-compose.yml -f docker-compose.prd.yml up -d --no-build

      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prd.yml down -v
