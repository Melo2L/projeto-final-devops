services:
  surf-data-service:
    build: ./services/surf-data-service
    image: local/surf-data-service:test
    expose:
      - "5001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}

  notification-service:
    build: ./services/notification-service
    image: local/notification-service:test
    expose:
      - "5002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}

  webapp:
    build: ./services/webapp
    image: local/webapp:test
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - ENABLE_OTEL=false
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-token}
      - SURF_DATA_URL=http://surf-data-service:5001
      - NOTIFY_URL=http://notification-service:5002
    depends_on:
      - surf-data-service
      - notification-service

  scheduler-service:
    build: ./services/scheduler-service
    image: local/scheduler-service:test
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-dev-token}
      - GATEWAY_URL=http://webapp:5000
      - SCHEDULE_SECONDS=${SCHEDULE_SECONDS:-60}
    depends_on:
      - webapp
    
